<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Rak Gudang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .kotak-konten {
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">MYGudang</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Daftar Rak</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">Tambah Data</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container kotak-konten">
        <h2>Formulir Tambah Data Rak</h2>
        <br>

        <form onsubmit="alert('Berhasil! Data formulir telah dikirim.'); return false;">
            <div class="mb-3">
                <label for="lorong" class="form-label">Nomor Lorong</label>
                <input type="text" class="form-control" id="lorong" name="nomor_lorong" placeholder="Contoh: C-1"
                    required>
            </div>
            <div class="mb-3">
                <label for="nama" class="form-label">Nama Rak Penyimpanan</label>
                <input type="text" class="form-control" id="nama" name="nama_rak" placeholder="Contoh: Rak sepatu"
                    required>
            </div>
            <div class="mb-3">
                <label for="kapasitas" class="form-label">Kapasitas Fisik</label>
                <input type="number" class="form-control" id="kapasitas" name="kapasitas" placeholder="Contoh: 100"
                    required>
            </div>
            <button type="submit" class="btn btn-primary">Simpan Data</button>
            <a href="index.html" class="btn btn-secondary">Kembali</a>
        </form>
    </div>

</body>

</html>
